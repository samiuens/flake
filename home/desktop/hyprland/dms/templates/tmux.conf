set -g status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"

set -g window-status-style "bg=default,fg={{colors.on_surface_variant.default.hex}}"
set -g window-status-current-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"

set -g window-status-format "#[fg={{colors.surface_container_high.default.hex}},bg={{colors.surface_container.default.hex}}]#[fg={{colors.on_surface.default.hex}},bg={{colors.surface_container_high.default.hex}}] #I #W #[fg={{colors.surface_container_high.default.hex}},bg={{colors.surface_container.default.hex}}]"
set -g window-status-current-format "#[fg={{colors.primary.default.hex}},bg={{colors.surface_container.default.hex}}]#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold] #I #W #[fg={{colors.primary.default.hex}},bg={{colors.surface_container.default.hex}}]"

set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

set -g message-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-command-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"

set -g mode-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"

set -g status-left-style "fg={{colors.primary.default.hex}}"
set -g status-right-style "fg={{colors.on_surface_variant.default.hex}}"
