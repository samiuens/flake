set -g status-style "bg={{colors.surface_container.dark.hex}},fg={{colors.on_surface.dark.hex}}"

set -g window-status-style "bg=default,fg={{colors.on_surface_variant.dark.hex}}"
set -g window-status-current-style "bg={{colors.primary.dark.hex}},fg={{colors.on_primary.dark.hex}},bold"

set -g window-status-format "#[fg={{colors.surface_container_high.dark.hex}},bg={{colors.surface_container.dark.hex}}]#[fg={{colors.on_surface.dark.hex}},bg={{colors.surface_container_high.dark.hex}}] #I #W #[fg={{colors.surface_container_high.dark.hex}},bg={{colors.surface_container.dark.hex}}]"
set -g window-status-current-format "#[fg={{colors.primary.dark.hex}},bg={{colors.surface_container.dark.hex}}]#[fg={{colors.on_primary.dark.hex}},bg={{colors.primary.dark.hex}},bold] #I #W #[fg={{colors.primary.dark.hex}},bg={{colors.surface_container.dark.hex}}]"

set -g pane-border-style "fg={{colors.outline.dark.hex}}"
set -g pane-active-border-style "fg={{colors.primary.dark.hex}}"

set -g message-style "bg={{colors.surface_container_high.dark.hex}},fg={{colors.on_surface.dark.hex}}"
set -g message-command-style "bg={{colors.surface_container_high.dark.hex}},fg={{colors.on_surface.dark.hex}}"

set -g mode-style "bg={{colors.primary_container.dark.hex}},fg={{colors.on_primary_container.dark.hex}}"

set -g status-left-style "fg={{colors.primary.dark.hex}}"
set -g status-right-style "fg={{colors.on_surface_variant.dark.hex}}"
